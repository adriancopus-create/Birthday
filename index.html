<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Happy Birthday Scratch Cards!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --hot-pink: #FF2D9B;
    --gold: #FFD700;
    --midnight: #0D0D2B;
    --midnight-2: #161640;
    --white: #FFFFFF;
    --coral: #FF6B6B;
    --teal: #4ECDC4;
    --purple: #9B59FF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    width: 100%;
    overflow-x: hidden;
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--white);
    background: radial-gradient(ellipse at top, #1a1a4a 0%, var(--midnight) 60%, #050518 100%);
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  /* Confetti background animation */
  .bg-confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bg-confetti span {
    position: absolute;
    top: -20px;
    width: 10px;
    height: 14px;
    opacity: 0.55;
    animation: bgFall linear infinite;
    border-radius: 2px;
  }
  @keyframes bgFall {
    0% { transform: translateY(-20px) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(720deg); }
  }

  /* Scoreboard */
  .scoreboard {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
    background: rgba(13,13,43,0.75);
    border: 2px solid var(--gold);
    border-radius: 14px;
    padding: 10px 14px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4), 0 0 0 2px rgba(255,215,0,0.15);
    font-weight: 700;
    font-size: 14px;
    line-height: 1.4;
    text-align: right;
    min-width: 130px;
  }
  .scoreboard .label { color: var(--gold); font-family: 'Fredoka One', cursive; letter-spacing: 0.5px; }
  .scoreboard .stats { color: var(--white); }
  .scoreboard .streak {
    margin-top: 4px;
    color: var(--coral);
    font-weight: 900;
    min-height: 18px;
    transition: transform 0.3s;
  }
  .scoreboard .streak.bump { transform: scale(1.15); }

  /* Layout */
  .app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }

  header.title {
    text-align: center;
    margin-top: 8px;
    margin-bottom: 4px;
  }
  header.title h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(38px, 7vw, 64px);
    color: var(--hot-pink);
    text-shadow:
      0 0 0 var(--white),
      3px 3px 0 var(--white),
      6px 6px 0 var(--gold),
      8px 10px 24px rgba(0,0,0,0.55);
    letter-spacing: 1px;
    transform: rotate(-2deg);
    animation: titleBob 3s ease-in-out infinite;
  }
  @keyframes titleBob {
    0%,100% { transform: rotate(-2deg) translateY(0); }
    50%     { transform: rotate(-2deg) translateY(-4px); }
  }
  .subtitle {
    margin-top: 8px;
    font-size: clamp(14px, 2.2vw, 18px);
    color: var(--white);
    opacity: 0.92;
    font-weight: 700;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    width: min(900px, 100%);
    margin: 28px auto 22px;
    perspective: 1000px;
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  }

  /* Card */
  .card {
    position: relative;
    aspect-ratio: 3 / 4;
    border-radius: 18px;
    background: var(--white);
    box-shadow:
      0 10px 22px rgba(0,0,0,0.45),
      inset 0 0 0 4px rgba(255,255,255,0.6);
    overflow: hidden;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.2,.9,.3,1.4), box-shadow 0.4s;
    will-change: transform;
  }
  .card.flipping {
    animation: flipReset 0.7s ease forwards;
  }
  @keyframes flipReset {
    0%   { transform: rotateY(0deg) scale(1); }
    50%  { transform: rotateY(90deg) scale(0.92); }
    100% { transform: rotateY(0deg) scale(1); }
  }
  .card.pop {
    animation: pop 0.45s cubic-bezier(.2,.9,.3,1.6);
  }
  @keyframes pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.10); }
    100% { transform: scale(1); }
  }
  .card.win-glow {
    animation: winPulse 1.2s ease-in-out infinite;
  }
  @keyframes winPulse {
    0%,100% { box-shadow: 0 0 0 4px rgba(255,215,0,0.0), 0 10px 22px rgba(0,0,0,0.45), inset 0 0 0 4px rgba(255,255,255,0.6); }
    50%     { box-shadow: 0 0 0 8px rgba(255,215,0,0.6), 0 0 30px 4px rgba(255,215,0,0.6), 0 10px 22px rgba(0,0,0,0.45), inset 0 0 0 4px var(--gold); }
  }

  /* Prize layer (under foil) */
  .prize {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 30%, #fff 0%, #fff8e1 70%, #ffe9b6 100%);
    text-align: center;
    padding: 8px;
  }
  .prize .emoji {
    font-size: clamp(44px, 9vw, 78px);
    line-height: 1;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
  }
  .prize .label {
    margin-top: 8px;
    font-family: 'Fredoka One', cursive;
    color: var(--hot-pink);
    font-size: clamp(14px, 2.4vw, 20px);
    letter-spacing: 0.5px;
  }
  .prize .sublabel {
    margin-top: 2px;
    font-size: 11px;
    color: var(--midnight);
    font-weight: 700;
    opacity: 0.7;
  }

  /* Wrapping (visible behind foil edges) */
  .wrap {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* Wrapping themes */
  .theme-dots {
    background-color: var(--hot-pink);
    background-image: radial-gradient(circle, var(--gold) 18%, transparent 19%),
                      radial-gradient(circle, var(--white) 12%, transparent 13%);
    background-size: 22px 22px, 22px 22px;
    background-position: 0 0, 11px 11px;
  }
  .theme-stripes {
    background:
      repeating-linear-gradient(45deg,
        var(--hot-pink) 0 14px,
        var(--gold) 14px 28px,
        var(--purple) 28px 42px,
        var(--white) 42px 56px);
  }
  .theme-plaid {
    background-color: var(--coral);
    background-image:
      linear-gradient(rgba(255,255,255,0.5) 2px, transparent 2px),
      linear-gradient(90deg, rgba(255,255,255,0.5) 2px, transparent 2px),
      linear-gradient(rgba(13,13,43,0.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(13,13,43,0.35) 1px, transparent 1px);
    background-size: 28px 28px, 28px 28px, 14px 14px, 14px 14px;
  }
  .theme-stars {
    background-color: var(--purple);
    background-image:
      radial-gradient(circle at 20% 30%, var(--gold) 2px, transparent 3px),
      radial-gradient(circle at 70% 60%, var(--white) 2px, transparent 3px),
      radial-gradient(circle at 40% 80%, var(--gold) 1.5px, transparent 2.5px),
      radial-gradient(circle at 85% 20%, var(--white) 2px, transparent 3px),
      radial-gradient(circle at 10% 75%, var(--gold) 1.5px, transparent 2.5px);
    background-size: 50px 50px;
  }
  .theme-argyle {
    background-color: var(--teal);
    background-image:
      linear-gradient(135deg, var(--hot-pink) 25%, transparent 25%),
      linear-gradient(225deg, var(--hot-pink) 25%, transparent 25%),
      linear-gradient(45deg, var(--gold) 25%, transparent 25%),
      linear-gradient(315deg, var(--gold) 25%, transparent 25%);
    background-size: 40px 40px;
    background-position: 0 0, 0 20px, 20px -20px, -20px 0;
  }

  /* Bow / ribbon overlay */
  .ribbon {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .ribbon::before, .ribbon::after {
    content: "";
    position: absolute;
    background: var(--gold);
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.15), 0 2px 6px rgba(0,0,0,0.35);
  }
  .ribbon::before {
    /* vertical band */
    left: 50%;
    top: 0;
    bottom: 0;
    width: 16%;
    transform: translateX(-50%);
  }
  .ribbon::after {
    /* horizontal band */
    top: 50%;
    left: 0;
    right: 0;
    height: 16%;
    transform: translateY(-50%);
  }
  .bow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 56%;
    height: 30%;
    transform: translate(-50%, -50%);
    z-index: 3;
    pointer-events: none;
  }
  .bow svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.4)); }

  /* Foil canvas */
  .foil-wrap {
    position: absolute;
    inset: 0;
    z-index: 4;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><text y="30" font-size="28">%F0%9F%AA%99</text></svg>') 12 12, pointer;
    overflow: hidden;
    border-radius: 18px;
  }
  .foil-wrap canvas { display: block; width: 100%; height: 100%; }
  .foil-wrap.gone {
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  /* Shimmer sweep over foil before scratching */
  .shimmer {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: linear-gradient(115deg,
      transparent 30%,
      rgba(255,255,255,0.55) 45%,
      rgba(255,255,255,0.85) 50%,
      rgba(255,255,255,0.55) 55%,
      transparent 70%);
    transform: translateX(-100%);
    animation: shimmerSweep 3.2s ease-in-out infinite;
    mix-blend-mode: screen;
    border-radius: 18px;
  }
  @keyframes shimmerSweep {
    0%   { transform: translateX(-100%); }
    55%  { transform: translateX(100%); }
    100% { transform: translateX(100%); }
  }
  .foil-wrap.gone + .shimmer,
  .foil-wrap.gone ~ .shimmer { display: none; }

  /* Buttons */
  .controls {
    margin-top: 14px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    background: linear-gradient(180deg, var(--hot-pink) 0%, #d11b80 100%);
    color: var(--white);
    border: 3px solid var(--gold);
    padding: 14px 28px;
    border-radius: 999px;
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,45,155,0.45), inset 0 -4px 0 rgba(0,0,0,0.18);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(255,45,155,0.55), inset 0 -4px 0 rgba(0,0,0,0.18); }
  .btn:active { transform: translateY(1px); box-shadow: 0 4px 10px rgba(255,45,155,0.35), inset 0 -2px 0 rgba(0,0,0,0.18); }

  /* Modal */
  .modal-back {
    position: fixed;
    inset: 0;
    background: rgba(13,13,43,0.6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .modal-back.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: linear-gradient(160deg, var(--midnight-2), var(--midnight));
    border: 4px solid var(--gold);
    border-radius: 22px;
    padding: 28px 28px 24px;
    width: min(440px, 92vw);
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 6px rgba(255,215,0,0.15);
    transform: scale(0.85);
    transition: transform 0.4s cubic-bezier(.2,.9,.3,1.6);
  }
  .modal-back.show .modal { transform: scale(1); }
  .modal h2 {
    font-family: 'Fredoka One', cursive;
    font-size: 36px;
    color: var(--gold);
    margin-bottom: 6px;
    text-shadow: 2px 2px 0 var(--hot-pink);
  }
  .modal h2.lose { color: var(--white); text-shadow: 2px 2px 0 var(--coral); }
  .modal p {
    margin: 8px 0 18px;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.4;
  }
  .modal .big-emoji {
    font-size: 64px;
    line-height: 1;
    margin: 4px 0 6px;
  }

  /* Confetti canvas (over modal) */
  .confetti-canvas {
    position: fixed;
    inset: 0;
    z-index: 60;
    pointer-events: none;
  }

  /* Foot */
  footer.foot {
    text-align: center;
    margin-top: 16px;
    font-size: 12px;
    opacity: 0.55;
  }
</style>
</head>
<body>
<div class="bg-confetti" id="bgConfetti" aria-hidden="true"></div>

<div class="scoreboard" aria-live="polite">
  <div class="label">🏆 Scoreboard</div>
  <div class="stats">Wins: <span id="winsCount">0</span> &middot; Played: <span id="playedCount">0</span></div>
  <div class="streak" id="streakLine"></div>
</div>

<div class="app">
  <header class="title">
    <h1>Happy Birthday! 🎂</h1>
    <div class="subtitle">Scratch 3 matching gifts to win! 🎉</div>
  </header>

  <div class="grid" id="grid" aria-label="Scratch cards"></div>

  <div class="controls">
    <button class="btn" id="playAgain" type="button">Play Again 🎁</button>
  </div>

  <footer class="foot">Drag across each card to scratch the foil. Touch friendly.</footer>
</div>

<div class="modal-back" id="modalBack" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="big-emoji" id="modalEmoji">🎉</div>
    <h2 id="modalTitle">WINNER!</h2>
    <p id="modalText">You matched 3 gifts!</p>
    <button class="btn" id="modalPlayAgain" type="button">Play Again 🎁</button>
  </div>
</div>

<canvas class="confetti-canvas" id="confettiCanvas" aria-hidden="true"></canvas>

<script>
(() => {
  'use strict';

  // ---------- Config ----------
  const PRIZES = [
    { e: '🎂', label: 'Cake!' },
    { e: '🎁', label: 'Gift!' },
    { e: '🎈', label: 'Balloon!' },
    { e: '🎉', label: 'Party!' },
    { e: '🎊', label: 'Confetti!' },
    { e: '🍰', label: 'Slice!' },
  ];
  const THEMES = ['theme-dots', 'theme-stripes', 'theme-plaid', 'theme-stars', 'theme-argyle'];
  const SCRATCH_THRESHOLD = 0.6;
  const RIBBON_COLORS = ['#FFD700', '#FF2D9B', '#FF6B6B', '#9B59FF', '#4ECDC4', '#FFFFFF'];

  // ---------- State ----------
  const state = {
    cards: [],          // [{ prize, scratched, el, foilCanvas, ctx, lastPoint, percent }]
    winningPrize: null,
    revealedCount: 0,
    matchCounts: {},
    gameOver: false,
    themeIndex: 0,
    stats: loadStats(),
  };

  function loadStats() {
    try {
      const raw = localStorage.getItem('birthdayScratchStats');
      if (raw) {
        const o = JSON.parse(raw);
        return {
          wins: +o.wins || 0,
          played: +o.played || 0,
          streak: +o.streak || 0,
        };
      }
    } catch (_) {}
    return { wins: 0, played: 0, streak: 0 };
  }
  function saveStats() {
    try { localStorage.setItem('birthdayScratchStats', JSON.stringify(state.stats)); } catch (_) {}
  }
  function renderStats(bumpStreak=false) {
    document.getElementById('winsCount').textContent = state.stats.wins;
    document.getElementById('playedCount').textContent = state.stats.played;
    const sl = document.getElementById('streakLine');
    if (state.stats.streak >= 2) {
      sl.textContent = `🔥 ${state.stats.streak} win streak!`;
      if (bumpStreak) {
        sl.classList.remove('bump');
        // force reflow then add
        void sl.offsetWidth;
        sl.classList.add('bump');
        setTimeout(() => sl.classList.remove('bump'), 320);
      }
    } else {
      sl.textContent = '';
    }
  }

  // ---------- Background confetti ----------
  function initBgConfetti() {
    const wrap = document.getElementById('bgConfetti');
    const colors = ['#FF2D9B','#FFD700','#FF6B6B','#9B59FF','#4ECDC4','#FFFFFF'];
    const count = 36;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('span');
      s.style.left = Math.random()*100 + 'vw';
      s.style.background = colors[i % colors.length];
      s.style.animationDuration = (6 + Math.random()*8) + 's';
      s.style.animationDelay = (-Math.random()*10) + 's';
      s.style.transform = `rotate(${Math.random()*360}deg)`;
      s.style.width = (6 + Math.random()*8) + 'px';
      s.style.height = (10 + Math.random()*10) + 'px';
      wrap.appendChild(s);
    }
  }

  // ---------- Audio (Web Audio API) ----------
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (_) {
        return null;
      }
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(()=>{});
    }
    return audioCtx;
  }

  // Reusable noise buffer for scratch SFX
  let noiseBuffer = null;
  function getNoiseBuffer(ctx) {
    if (noiseBuffer) return noiseBuffer;
    const len = ctx.sampleRate * 1.0;
    noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random()*2 - 1;
    return noiseBuffer;
  }

  // Throttled scratch sound
  let lastScratchAt = 0;
  function playScratch() {
    const ctx = getCtx();
    if (!ctx) return;
    const now = performance.now();
    if (now - lastScratchAt < 55) return;
    lastScratchAt = now;

    const src = ctx.createBufferSource();
    src.buffer = getNoiseBuffer(ctx);
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1800 + Math.random()*1200;
    filter.Q.value = 1.0;
    const gain = ctx.createGain();
    const t = ctx.currentTime;
    const dur = 0.07 + Math.random()*0.04;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.18, t + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter).connect(gain).connect(ctx.destination);
    src.start(t);
    src.stop(t + dur + 0.02);
  }

  function playDing() {
    const ctx = getCtx();
    if (!ctx) return;
    const t = ctx.currentTime;
    // Two ascending tones for "card revealed"
    const notes = [880, 1320];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const start = t + i * 0.08;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.25, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.4);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.45);
    });
  }

  function playWin() {
    const ctx = getCtx();
    if (!ctx) return;
    const t = ctx.currentTime;
    // C major arpeggio plus a high topper: C5 E5 G5 C6 E6
    const seq = [523.25, 659.25, 783.99, 1046.50, 1318.51];
    seq.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc2.type = 'square';
      osc.frequency.value = freq;
      osc2.frequency.value = freq * 2;
      const start = t + i * 0.13;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.45);
      const mix = ctx.createGain();
      mix.gain.value = 0.5;
      osc.connect(gain);
      osc2.connect(mix).connect(gain);
      gain.connect(ctx.destination);
      osc.start(start); osc2.start(start);
      osc.stop(start + 0.5); osc2.stop(start + 0.5);
    });
  }

  function playLose() {
    const ctx = getCtx();
    if (!ctx) return;
    const t = ctx.currentTime;
    // "Wah-wah" descending trombone-ish
    const seq = [392.00, 349.23, 311.13, 261.63];
    seq.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filt = ctx.createBiquadFilter();
      filt.type = 'lowpass';
      filt.frequency.value = 1200;
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq * 1.05, t + i*0.18);
      osc.frequency.exponentialRampToValueAtTime(freq, t + i*0.18 + 0.18);
      const start = t + i*0.18;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.22, start + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.32);
      osc.connect(filt).connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.36);
    });
  }

  // ---------- Game setup ----------
  function pickWinningSetup() {
    const winningPrize = PRIZES[Math.floor(Math.random()*PRIZES.length)];
    const positions = [0,1,2,3,4,5];
    // shuffle
    for (let i = positions.length-1; i>0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [positions[i], positions[j]] = [positions[j], positions[i]];
    }
    const winningSlots = new Set(positions.slice(0, 3));
    // Fill remaining 3 with prizes that are NOT 3-of-a-kind of any other symbol
    const others = PRIZES.filter(p => p.e !== winningPrize.e);
    // Pick 3 distinct (or with at most 2 same)
    const remaining = [];
    // Strategy: shuffle others, take 3; if it accidentally produces 3-of-a-kind (only if others has >=3 of same — they don't since unique), we're safe.
    const shuffled = others.slice().sort(()=>Math.random()-0.5);
    for (let i = 0; i < 3; i++) {
      remaining.push(shuffled[i % shuffled.length]);
    }
    // Avoid producing another 3-of-a-kind among the 3 fillers
    const counts = {};
    for (const p of remaining) counts[p.e] = (counts[p.e]||0)+1;
    for (const k in counts) {
      if (counts[k] >= 3) {
        // swap one out for a different non-winning prize
        for (let i = 0; i < remaining.length; i++) {
          if (remaining[i].e === k) {
            const sub = others.find(o => o.e !== k);
            if (sub) { remaining[i] = sub; break; }
          }
        }
      }
    }

    const layout = new Array(6);
    let rIdx = 0;
    for (let i = 0; i < 6; i++) {
      if (winningSlots.has(i)) layout[i] = winningPrize;
      else { layout[i] = remaining[rIdx++]; }
    }
    return { winningPrize, layout, winningSlots };
  }

  function bowSVG(color1, color2) {
    return `
      <svg viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg1" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="${color1}"/>
            <stop offset="1" stop-color="${color2}"/>
          </linearGradient>
        </defs>
        <ellipse cx="20" cy="25" rx="20" ry="16" fill="url(#bg1)" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/>
        <ellipse cx="80" cy="25" rx="20" ry="16" fill="url(#bg1)" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/>
        <rect x="42" y="14" width="16" height="22" rx="4" fill="${color1}" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
        <ellipse cx="20" cy="25" rx="6" ry="4" fill="rgba(0,0,0,0.18)"/>
        <ellipse cx="80" cy="25" rx="6" ry="4" fill="rgba(0,0,0,0.18)"/>
      </svg>
    `;
  }

  function buildCard(idx, prize, themeClass) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = idx;

    // Prize layer
    const prizeEl = document.createElement('div');
    prizeEl.className = 'prize';
    prizeEl.innerHTML = `
      <div class="emoji">${prize.e}</div>
      <div class="label">${prize.label}</div>
      <div class="sublabel">Birthday Prize</div>
    `;
    card.appendChild(prizeEl);

    // Wrapping (peeks behind ribbon area)
    const wrap = document.createElement('div');
    wrap.className = 'wrap ' + themeClass;
    card.appendChild(wrap);

    // Ribbon
    const ribbon = document.createElement('div');
    ribbon.className = 'ribbon';
    card.appendChild(ribbon);

    // Bow
    const bow = document.createElement('div');
    bow.className = 'bow';
    const c1 = RIBBON_COLORS[(idx + state.themeIndex) % RIBBON_COLORS.length];
    const c2 = RIBBON_COLORS[(idx + 2 + state.themeIndex) % RIBBON_COLORS.length];
    bow.innerHTML = bowSVG(c1, c2);
    card.appendChild(bow);

    // Foil canvas wrap
    const foilWrap = document.createElement('div');
    foilWrap.className = 'foil-wrap';
    const canvas = document.createElement('canvas');
    foilWrap.appendChild(canvas);
    card.appendChild(foilWrap);

    // Shimmer
    const shimmer = document.createElement('div');
    shimmer.className = 'shimmer';
    card.appendChild(shimmer);

    return { card, foilWrap, canvas, shimmer };
  }

  function paintFoil(canvas, ctx) {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr, dpr);

    const w = rect.width, h = rect.height;

    // Base gold gradient
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0,   '#b8860b');
    g.addColorStop(0.25,'#FFD700');
    g.addColorStop(0.5, '#fff7c2');
    g.addColorStop(0.75,'#FFD700');
    g.addColorStop(1,   '#8a6a00');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    // Cross-hatch shimmer lines
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    for (let i = -h; i < w; i += 6) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.lineTo(i + h, h);
      ctx.stroke();
    }
    ctx.globalAlpha = 0.10;
    ctx.strokeStyle = '#000';
    for (let i = -h; i < w; i += 8) {
      ctx.beginPath();
      ctx.moveTo(i + h, 0);
      ctx.lineTo(i, h);
      ctx.stroke();
    }

    // Noise speckle
    ctx.globalAlpha = 1;
    const speckle = Math.floor(w * h / 18);
    for (let i = 0; i < speckle; i++) {
      const x = Math.random()*w, y = Math.random()*h;
      const a = Math.random();
      ctx.fillStyle = a < 0.5 ? `rgba(255,255,255,${0.05+Math.random()*0.18})` : `rgba(0,0,0,${0.04+Math.random()*0.10})`;
      ctx.fillRect(x, y, 1, 1);
    }

    // "SCRATCH HERE" stamp
    ctx.save();
    ctx.translate(w/2, h/2);
    ctx.rotate(-Math.PI/14);
    ctx.font = `700 ${Math.round(Math.min(w,h)*0.13)}px 'Fredoka One', cursive, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillText('SCRATCH', 0, -Math.min(w,h)*0.06);
    ctx.fillText('HERE!', 0,  Math.min(w,h)*0.10);
    ctx.restore();

    ctx.globalCompositeOperation = 'destination-out';
  }

  function setupCardInteractions(cardObj, idx) {
    const { canvas, foilWrap, card } = cardObj;
    const ctx = canvas.getContext('2d');
    paintFoil(canvas, ctx);

    cardObj.ctx = ctx;
    cardObj.percent = 0;
    cardObj.scratched = false;
    cardObj.lastPoint = null;
    cardObj.lastCheck = 0;

    const getXY = (ev) => {
      const rect = canvas.getBoundingClientRect();
      let cx, cy;
      if (ev.touches && ev.touches.length) {
        cx = ev.touches[0].clientX;
        cy = ev.touches[0].clientY;
      } else {
        cx = ev.clientX; cy = ev.clientY;
      }
      return { x: cx - rect.left, y: cy - rect.top };
    };

    const radius = () => {
      const r = canvas.getBoundingClientRect();
      return Math.max(18, Math.min(r.width, r.height) * 0.13);
    };

    const scratchAt = (p) => {
      const r = radius();
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI*2);
      ctx.fill();
      if (cardObj.lastPoint) {
        ctx.lineWidth = r*2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cardObj.lastPoint.x, cardObj.lastPoint.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }
      cardObj.lastPoint = p;
      playScratch();
      maybeCheckProgress();
    };

    const maybeCheckProgress = () => {
      const now = performance.now();
      if (now - cardObj.lastCheck < 110) return;
      cardObj.lastCheck = now;
      // sample
      const w = canvas.width, h = canvas.height;
      const step = 8;
      const data = ctx.getImageData(0, 0, w, h).data;
      let cleared = 0, total = 0;
      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          const idx = (y*w + x)*4 + 3;
          if (data[idx] < 32) cleared++;
          total++;
        }
      }
      cardObj.percent = cleared / total;
      if (!cardObj.scratched && cardObj.percent >= SCRATCH_THRESHOLD) {
        markScratched(cardObj);
      }
    };

    let dragging = false;
    const onDown = (ev) => {
      if (cardObj.scratched || state.gameOver) return;
      ev.preventDefault();
      getCtx(); // unlock audio on first interaction
      dragging = true;
      cardObj.lastPoint = null;
      const p = getXY(ev);
      scratchAt(p);
    };
    const onMove = (ev) => {
      if (!dragging) return;
      ev.preventDefault();
      const p = getXY(ev);
      scratchAt(p);
    };
    const onUp = () => {
      dragging = false;
      cardObj.lastPoint = null;
    };

    foilWrap.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);

    foilWrap.addEventListener('touchstart', onDown, { passive: false });
    foilWrap.addEventListener('touchmove', onMove, { passive: false });
    foilWrap.addEventListener('touchend', onUp);
    foilWrap.addEventListener('touchcancel', onUp);

    // Cleanup hooks for resets
    cardObj._cleanup = () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
  }

  function markScratched(cardObj) {
    if (cardObj.scratched) return;
    cardObj.scratched = true;
    // Clear remaining foil completely
    const { ctx, canvas, foilWrap, card } = cardObj;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    foilWrap.classList.add('gone');
    card.classList.add('pop');
    playDing();

    state.revealedCount++;
    const e = cardObj.prize.e;
    state.matchCounts[e] = (state.matchCounts[e]||0) + 1;

    // Glow winning cards once we know
    if (e === state.winningPrize.e) {
      // wait until 3 are revealed of the winning prize
      if (state.matchCounts[e] >= 3) {
        // glow all winning cards revealed
        state.cards.forEach(c => {
          if (c.prize.e === state.winningPrize.e) c.card.classList.add('win-glow');
        });
      }
    }

    if (state.revealedCount >= 6) {
      finishGame();
    }
  }

  function finishGame() {
    if (state.gameOver) return;
    state.gameOver = true;

    const won = (state.matchCounts[state.winningPrize.e] || 0) >= 3;
    state.stats.played++;
    if (won) {
      state.stats.wins++;
      state.stats.streak++;
    } else {
      state.stats.streak = 0;
    }
    saveStats();
    renderStats(true);

    setTimeout(() => showResult(won), 550);
  }

  // ---------- Confetti burst ----------
  const confettiCanvas = document.getElementById('confettiCanvas');
  const cctx = confettiCanvas.getContext('2d');
  let confettiParticles = [];
  let confettiAnim = null;

  function resizeConfetti() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  resizeConfetti();
  window.addEventListener('resize', resizeConfetti);

  function burstConfetti() {
    const w = confettiCanvas.width, h = confettiCanvas.height;
    const colors = ['#FF2D9B','#FFD700','#FF6B6B','#9B59FF','#4ECDC4','#FFFFFF'];
    confettiParticles = [];
    for (let i = 0; i < 180; i++) {
      const angle = (Math.random() * Math.PI * 2);
      const speed = 6 + Math.random()*10;
      confettiParticles.push({
        x: w/2 + (Math.random()-0.5)*40,
        y: h/2 + (Math.random()-0.5)*20,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed - 4,
        g: 0.18 + Math.random()*0.12,
        size: 5 + Math.random()*7,
        rot: Math.random()*Math.PI*2,
        vr: (Math.random()-0.5)*0.3,
        color: colors[i % colors.length],
        life: 0,
        maxLife: 120 + Math.random()*60,
        shape: Math.random() < 0.5 ? 'rect' : 'circle',
      });
    }
    if (confettiAnim) cancelAnimationFrame(confettiAnim);
    const tick = () => {
      cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
      let alive = 0;
      for (const p of confettiParticles) {
        p.vy += p.g;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.life++;
        if (p.life < p.maxLife && p.y < confettiCanvas.height + 40) {
          alive++;
          cctx.save();
          cctx.translate(p.x, p.y);
          cctx.rotate(p.rot);
          cctx.fillStyle = p.color;
          if (p.shape === 'rect') {
            cctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*1.4);
          } else {
            cctx.beginPath();
            cctx.arc(0, 0, p.size/2, 0, Math.PI*2);
            cctx.fill();
          }
          cctx.restore();
        }
      }
      if (alive > 0) {
        confettiAnim = requestAnimationFrame(tick);
      } else {
        cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
        confettiAnim = null;
      }
    };
    confettiAnim = requestAnimationFrame(tick);
  }

  // ---------- Modal / Result ----------
  function showResult(won) {
    const back = document.getElementById('modalBack');
    const title = document.getElementById('modalTitle');
    const text = document.getElementById('modalText');
    const emoji = document.getElementById('modalEmoji');

    if (won) {
      title.textContent = 'WINNER!';
      title.classList.remove('lose');
      text.innerHTML = `You matched <b>three ${state.winningPrize.e}</b>! Happy Birthday! 🎂`;
      emoji.textContent = '🏆';
      playWin();
      burstConfetti();
    } else {
      title.textContent = 'Better Luck Next Time!';
      title.classList.add('lose');
      const winSym = state.winningPrize.e;
      text.innerHTML = `The winning gift was <b>${winSym}</b>. Try again!`;
      emoji.textContent = '🎈';
      playLose();
    }
    back.classList.add('show');
  }
  function hideModal() {
    document.getElementById('modalBack').classList.remove('show');
  }

  // ---------- Build / Reset ----------
  const grid = document.getElementById('grid');

  function buildGame() {
    grid.innerHTML = '';
    state.cards = [];
    state.revealedCount = 0;
    state.matchCounts = {};
    state.gameOver = false;

    // Cycle wrap theme each game
    state.themeIndex = (state.themeIndex + 1) % THEMES.length;
    const themeClass = THEMES[state.themeIndex];

    const setup = pickWinningSetup();
    state.winningPrize = setup.winningPrize;

    setup.layout.forEach((prize, idx) => {
      const built = buildCard(idx, prize, themeClass);
      grid.appendChild(built.card);
      const cardObj = {
        prize,
        card: built.card,
        foilWrap: built.foilWrap,
        canvas: built.canvas,
        shimmer: built.shimmer,
      };
      state.cards.push(cardObj);
      // Defer paint until in the DOM so size is correct
      requestAnimationFrame(() => setupCardInteractions(cardObj, idx));
    });
  }

  function flipResetThenBuild() {
    // Cascade flip on existing cards, then rebuild
    const existing = Array.from(grid.children);
    if (existing.length === 0) {
      buildGame();
      return;
    }
    existing.forEach((el, i) => {
      setTimeout(() => el.classList.add('flipping'), i * 60);
    });
    const total = existing.length * 60 + 700;
    setTimeout(() => {
      hideModal();
      buildGame();
    }, total);
  }

  // ---------- Wire up ----------
  document.getElementById('playAgain').addEventListener('click', flipResetThenBuild);
  document.getElementById('modalPlayAgain').addEventListener('click', flipResetThenBuild);

  // Repaint foil layers on resize (since canvas resolution depends on layout)
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      state.cards.forEach(c => {
        if (c.scratched) return;
        // re-paint clean foil only if not yet scratched at all
        if ((c.percent || 0) < 0.02) {
          paintFoil(c.canvas, c.ctx);
        }
      });
    }, 180);
  });

  // ---------- Boot ----------
  initBgConfetti();
  renderStats();
  buildGame();
})();
</script>
</body>
</html>
